t;95\&quot; width=\&quot;190\&quot; x=\&quot;-200\&quot; y=\&quot;848.79\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;uiQGxeHGiCThkwprLoSC-15\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;rounded=1;\&quot; value=\&quot;&amp;lt;b&amp;gt;Diagrama de Componentes:&amp;lt;/b&amp;gt; Muestra cómo se organizan y dependen entre sí las piezas de software (componentes físicos).\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;95\&quot; width=\&quot;170\&quot; x=\&quot;10\&quot; y=\&quot;848.79\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;uiQGxeHGiCThkwprLoSC-17\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;rounded=1;\&quot; value=\&quot;&amp;lt;b&amp;gt;Diagrama de Despliegue:&amp;lt;/b&amp;gt; Representa la arquitectura física (hardware) y cómo los componentes de software se instalan en esos nodos.\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;95\&quot; width=\&quot;170\&quot; x=\&quot;200\&quot; y=\&quot;848.79\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;uiQGxeHGiCThkwprLoSC-22\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;uiQGxeHGiCThkwprLoSC-19\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; target=\&quot;uiQGxeHGiCThkwprLoSC-21\&quot; value=\&quot;\&quot;&gt;&lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;uiQGxeHGiCThkwprLoSC-19\&quot; parent=\&quot;1\&quot; style=\&quot;whiteSpace=wrap;html=1;rounded=1;\&quot; value=\&quot;2. Diagramas de Comportamiento\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;60\&quot; width=\&quot;120\&quot; x=\&quot;350\&quot; y=\&quot;980\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;uiQGxeHGiCThkwprLoSC-24\&quot; edge=\&quot;1\&quot; parent=\&quot;1\&quot; source=\&quot;uiQGxeHGiCThkwprLoSC-21\&quot; style=\&quot;edg
